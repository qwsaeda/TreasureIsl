# android-activity — 金银岛 TreasureIsl 的 Bevy Android JNI 壳（cargo-apk 标准布局，S18.8d）
#
# S18.8d 切 Bevy 后：本 crate 不再依赖 miniquad/macroquad（旧壳已退役）。
# 编译形态：`src/lib.rs` 用 `include!` 引入 ti-engine 的 Bevy 壳源
# （`crates/ti-engine/src/bin/treasure_bevy.rs` 同一文件），使 cdylib 与
# native bin 共享同一 `run()` ⇒ 单一事实源、0 双壳漂移。壳内
# `#[cfg(target_os = "android")]` 段激活 `android_main(AndroidApp)`
# （`android_entry.rs`，JNI 入口，`JNI_OnLoad` 由 android-activity crate 导出转交）。
#
# 依赖集 = ti-engine 壳 bin 的完整依赖面（include 的是同一源文件，
# 缺任何一项 E0433）；bevy 用与根 workspace 同款特性 + `android-native-activity`。
#
# 交叉编译（本机 Linux + NDK r25b，`docs/migration_linux.md` §4）：
#   CC_aarch64_linux_android=$NDK/.../bin/aarch64-linux-android21-clang
#   AR_aarch64_linux_android=$NDK/.../bin/llvm-ar
#   RUSTFLAGS="-C linker=$NDK/.../bin/aarch64-linux-android21-clang"
#   cargo build -p android-activity@0.1.0 --release --target aarch64-linux-android
#   ⇒ target/aarch64-linux-android/release/libandroid_activity.so（APK 唯一 native 产物）

[package]
name = "android-activity"
version = "0.1.0"
edition = "2024"
description = "Bevy Android JNI 壳（S18.8d）：cdylib 入口，include! 复用 ti-engine Bevy 壳源"
publish = false

[lib]
# Android 的 native 入口必须是 cdylib（被 NativeActivity 的 JNI `System.loadLibrary` 加载）
name = "android_activity"
crate-type = ["cdylib"]

[dependencies]
# winit 0.30.13 的 android 后端胶水（`JNI_OnLoad` + NativeActivity 生命周期；
# 与 bevy/winit 传递依赖同版族 = Cargo.lock 锁定 0.6.x）。
android-activity = { version = "0.6.0", features = ["native-activity"] }
# 与 ti-engine 壳 bin 同款 bevy（workspace 特性表 + android 壳 feature）：
# bevy_android → winit/android-native-activity → android-activity（native 后端）。
bevy = { version = "=0.20.0", default-features = false, features = ["2d", "bevy_ui", "bevy_ui_render", "bevy_text", "touch", "keyboard", "mouse", "complex_script_segmentation", "android-native-activity"] }
ti-render.workspace = true
ti-app = { workspace = true, features = ["hd-8bit", "gpu-render", "stats"] }
ti-platform.workspace = true
ti-core.workspace = true
ab_glyph.workspace = true
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12", "metal", "vulkan", "gles", "fragile-send-sync-non-atomic-wasm"] }
serde_json.workspace = true
# 壳源 `treasure_bevy.rs` 引用 `ti_engine::{ui, scene_render, ...}`（lib 公共面）
ti-engine.workspace = true

[lints]
workspace = true
