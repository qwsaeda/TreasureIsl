[workspace]
resolver = "2"
members = [
    "crates/ti-formats",
    "crates/ti-core",
    "crates/ti-platform",
    "crates/ti-render",
    "crates/ti-app",
    "crates/ti-tools",
    # S27.7：crates/ti-engine（Bevy 交付壳）**并回根 workspace**（S18.8 计划项落地，
    # 用户 2026-10-29 要求「crates 中的项目统一由根 Cargo.toml 管理」）。
    # 原独立 workspace 的唯一理由 = `links=alsa` 冲突（bevy 的 rodio→alsa-sys vs
    # macroquad 的 quad-snd→quad-alsa-sys）：macroquad 音频自 S18.8d 起只挂
    # `android-shell` feature（可选，默认不启用），bevy 侧未开 audio 特性
    # ⇒ 同一依赖图里不再同时出现两个 `links=alsa` 的包，冲突前提消失。
    "crates/ti-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
flate2 = "1"
macroquad = "0.4"
opus-pure = "0.2"
# S7.5：HD 资产 PNG 解码（§5.9 定案清单，`ti-platform` optional，feature `hd-8bit` 门控，
# 默认构建不进依赖树——EXP-046 模式）
png = "0.17"
# S8.7：RNG / FNV 库化（替换手写 LCG + 手写 FNV，见 docs/process/01_architecture.md §4）
# rand_pcg（可复现 PCG64，docs/business/persistence.md §RNG「目标库复用」）
# fnv（FNV 哈希，替换 ti-tools/src/hash.rs 手写 fnv1a64）
# EXP-057：rand_pcg 0.9 的 PCG64 = Lcg128Xsl64（Lcg128Xsl64::new(state, stream) 确定性播种
# + RngCore::next_u64() 取值）；0.8 的 Pcg64 旧型名在 0.9 不存在。锁定精确版。
# 仅引 `rand_pcg` + `rand_core`（RngCore trait）；`rand` 主 crate 未使用（禁 thread_rng，
# 玩法层只经 `ti-core::rules::rng` 可播种 GameRng，S8.7 库复用判据：不引未用依赖）。
rand_pcg = "=0.9.0"
rand_core = "=0.9.5"
fnv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ti-formats = { path = "crates/ti-formats" }
ti-core = { path = "crates/ti-core" }
ti-platform = { path = "crates/ti-platform" }
ti-render = { path = "crates/ti-render" }
# UI-21 字体：ab_glyph 纯 Rust TTF/OTF 光栅化（无 Freetype 依赖，适合 CPU Framebuf 路径）
ab_glyph = "0.2"
# S18：bevy 依赖（S27.7 起 ti-engine 并回根 workspace，bevy 版本/特性在根统一登记）。
# 特性口径（0.20 实测特性表）：
# - "2d" = default_app + default_platform + 2d_bevy_render + scene + picking（3D/UI 全关）
# - "bevy_text"（0.20 特性名是 bevy_text 非 bevy_text_2d）
# - "touch"（触摸输入；浏览器触摸映射 S18.1 结论据此）
# **不开 audio 特性**（发货无声口径 S18.8/S30.0；也是 links=alsa 冲突前提消失的原因）。
# S26.1：complex_script_segmentation = parley/complex-scripts —— 不开时 parley 只用
# 东南亚四语 icu 数据集（new_southeast_asian，无中日文 cjdict）⇒ 每帧 CJK 断词打
# 「ICU4X data error: No segmentation model for language: ja」（debug 实测 24 行刷屏），
# 且中文词级断行退化为整段不断。开了 = 完整 icu 字典（含 cjdict），报错消失 + 断行正确。
# S29.1（B1）：+ "bevy_ui"（Node/Layout/Text/Button/IsDefaultUiCamera；UI 相机分层叠游戏世界之上，
# UI 树走屏幕像素自动布局 + resize 重排；游戏世界仍 1080 正交 o.scale。定案 docs/process/17_layout_engine.md）。
# 版本 **精确钉 0.20.0**（`=0.20.0`）：bevy 子 crate 同版本族，混版（如 bevy_text 0.20.1 +
# bevy_internal 0.20.0）会在解析期撞 `bevy_clipboard` 版本冲突（S27.7 合并后首次解析实测）。
bevy = { version = "=0.20.0", default-features = false, features = ["2d", "bevy_ui", "bevy_ui_render", "bevy_text", "touch", "keyboard", "mouse", "complex_script_segmentation"] }
# S27.7：ti-engine（并回根 workspace 后）依赖的成员 crate 登记在此；
# `ti-app` 用 `default-features = false`（ti-engine 侧显式开 hd-8bit/gpu-render/stats）。
ti-app = { path = "crates/ti-app", default-features = false }

[profile.release]
# S27.7：ti-engine 并回根 workspace 后，profile 只在根生效（子 workspace 的
# `[profile.release]` 会被 Cargo 忽略）⇒ wasm 体积口径（11_bevy_migration §3）
# 的 `strip = "symbols"` 迁到根，对全部 member 生效（只影响符号，不改优化级别）。
strip = "symbols"


[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
