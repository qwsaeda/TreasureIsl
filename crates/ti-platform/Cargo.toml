[package]
name = "ti-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "平台抽象层：gfx/input/audio/storage/clock trait（后端实现于 S2）"

[dependencies]
thiserror.workspace = true
# S18.8b（macroquad 退役）：原 `macroquad` 依赖删；`FilterMode` 薄封装改挂
# bevy `TextureFilter`（settings.rs §5.6.6；2 变体 1:1，版本与 ti-engine 同族）。
bevy.workspace = true
ti-core.workspace = true
ti-formats.workspace = true
ti-render.workspace = true
# S1.7b OGG/Opus 转码（feature `ogg`）：仅 ti-tools（mod2ogg/build_assets）
# 与 ti-app 的 mod-ogg 测试链路显式开启；游戏运行时（wasm/native 壳）默认关闭，
# 避免 ~500 KB 编码器体积（wasm 800 KB 预算，docs/plan-s4.md §S4.3）。
# 产物由 build_assets 离线预转码到 assets_out/audio/，运行时直接播放 OGG 文件。
opus-pure = { workspace = true, optional = true }
# S7.5 HD 资产 PNG 解码（feature `hd-8bit`）：§5.9 定案清单的 `png`，
# 仅 HD 渲染路径使用；默认构建不进依赖树（EXP-046 门控模式）。
png = { workspace = true, optional = true }

[features]
default = []
# OGG/Opus 编码能力（S1.7b）
ogg = ["dep:opus-pure"]
# S7.5 RGBA8 HD 帧缓冲 + PNG 解码（默认关，RGB565 原路径逐像素不变）
hd-8bit = ["dep:png"]

[lints]
workspace = true
