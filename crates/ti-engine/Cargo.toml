# S27.7：ti-engine **并回根 workspace**（用户 2026-10-29：crates 内项目统一由根 Cargo.toml 管理）。
# 原独立 workspace 的唯一理由 = `links=alsa` 冲突（bevy 的 rodio→alsa-sys vs macroquad 的
# quad-snd→quad-alsa-sys）：macroquad 音频自 S18.8d 起只挂 `android-shell` feature（可选），
# bevy 侧未开 audio 特性 ⇒ 同一依赖图里不再同时出现两个 `links=alsa` 的包。
# 依赖版本/特性统一在根 `Cargo.toml` 的 `[workspace.dependencies]` 登记（bevy 特性表在根注释）。
[package]
name = "ti-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# S24.1：resizetest.rs 是 treasure_bevy 壳的子模块（`mod resizetest;`），不是独立 bin
# —— 关掉 src/bin/ 自动 bin 探测，否则 cargo 把它当第三个 bin 编译（`super::` 越 crate 根
# 必编译失败，且 gate 只构建声明 bin 时此错潜伏不报）。
autobins = false
description = "S18：Bevy 呈现后端（Canvas trait 的 Bevy 实现 + 相机/层/粒子）；零游戏语义，与 ti-render 对等定位（docs/process/11_bevy_migration.md §4）"

[lib]
name = "ti_engine"

# S18.4：bevy 呈现壳 bin（native 可玩 / wasm 编译；同源码 `cfg(target_arch)` 分支，
# 资源加载 native = std::fs 仓库资源，wasm = 降级形态无资源（资源链 S18.8 bevy 资产管线））。
[[bin]]
name = "treasure-bevy-native"
path = "src/bin/treasure_bevy.rs"

[[bin]]
name = "treasure-bevy-wasm"
path = "src/bin/treasure_bevy.rs"

[dependencies]
# bevy 0.20 pin（11_bevy_migration §1）；特性清单与口径见根 `Cargo.toml` `[workspace.dependencies]`。
bevy.workspace = true
ti-render.workspace = true
# S18.4：bevy 壳 bin 挂 ti-app（架构修正：links=alsa 冲突检查 target-independent 且
# optional 依赖也进 resolution 图；macroquad 音频仅在 android-shell feature 下沉为可选）。
# ti-app 以 default-features=false 挂入（关 macroquad），显式开 hd-8bit/gpu-render/stats
# （与发货壳同画质路径 + 性能诊断）。
ti-app = { workspace = true, features = ["hd-8bit", "gpu-render", "stats"] }
ti-platform.workspace = true
ti-core.workspace = true
# S18.3：字号对齐对照需与 ti-app `MenuShell::draw_ttf_row` 逐式同算法（baseline 偏移按
# ab_glyph 轮廓算），故直引 ab_glyph（版本与根 workspace 一致 = 0.2，与 ti-render 同一份光栅器）。
ab_glyph.workspace = true
# S18.7：原语参数读取（`serde_json::Value` 取值/类型判定）。
serde_json.workspace = true
# S31.2b：wasm 侧地图包 fetch 预取（`map_pack_fetch` 模块，`21_map_package_spec.md` §7）：
# 版本对齐 lock 里 bevy 0.20 传递依赖（wasm-bindgen 0.2.129 / js-sys 0.3.106 /
# wasm-bindgen-futures 0.4.79 / web-sys 0.3.106），native 构建下这些 crate 不进 wasm 目标产物
# （模块 `#[cfg(target_arch = "wasm32")]` 门控，0 native 影响）。
# S18.8d：Bevy android 壳（NDK 交叉编译 aarch64-linux-android；NDK 工具链本地
# /tmp/opencode/android-ndk-r25b，见 docs/migration_linux.md §4）。bevy 0.20 的 android
# 壳 feature = bevy_android -> winit/android-native-activity -> android-activity（JNI
# 符号由 winit 自带，本壳 0 手写 JNI；活动生命周期由 winit 的 android backend 接管）。
[target.'cfg(target_os = "android")'.dependencies]
# bevy/wgpu 开 `gles` 后端（redroid 无 Vulkan ICD，EGL/OpenGL 软渲染是 redroid 可用路径）。
# wgpu 直连（版本与 bevy_render 传递依赖 30 同族）：`gles` feature 经 wgpu 依赖传递到
# wgpu-hal；bevy_render 的 wgpu 默认开 vulkan+dx12+metal（feature 合并不互斥，双后端共存）。
bevy = { version = "=0.20.0", default-features = false, features = ["2d", "bevy_ui", "bevy_ui_render", "bevy_text", "touch", "keyboard", "mouse", "complex_script_segmentation", "android-native-activity"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12", "metal", "vulkan", "gles", "fragile-send-sync-non-atomic-wasm"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Cache", "Response", "Request", "Headers"] }

[lints]
workspace = true
