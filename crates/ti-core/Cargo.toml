[package]
name = "ti-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TreasureIsl 玩法核心：数值、规则、场景状态机（无平台依赖）"

[dependencies]
ti-formats.workspace = true
serde.workspace = true
# S8.1：assets/data/*.json 运行时反序列化（data.rs 的 OnceLock 加载层，
# include_str! 进包保证 wasm 免运行时 IO；解析失败硬错误不 fallback）
serde_json.workspace = true
# S8.7：RNG 库化（`docs/business/persistence.md` §RNG「目标库复用」，替手写 LCG）
# 玩法层只经 `rules::rng` 取随机（禁 `thread_rng` 不可复现）；`rand_pcg` = PCG64 可播种。
# EXP-057：rand_pcg 0.9 的 PCG64 = Lcg128Xsl64（`Lcg128Xsl64::new(state, stream)` 确定性
# 播种 + `RngCore::next_u64()` 取值）。仅引 `rand_pcg` + `rand_core`（RngCore trait），
# `rand` 主 crate 未使用，不引未用依赖。
rand_pcg.workspace = true
rand_core.workspace = true

# S11：oracle 原版参照实现已归档；重复 crate `legacy/oracle-rust` 于 S15.8 删除。
# 唯一镜像源 = 本 crate `src/oracle/`，经 lib.rs `pub mod oracle` 公开导出，集成测试
# `reference_diff_*` / `diff_*` 直接 `use ti_core::oracle::`；故无 feature 门控、无 dev-dep。

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
