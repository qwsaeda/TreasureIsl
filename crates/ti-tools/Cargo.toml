[package]
name = "ti-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "逆向与资源管线工具：台账校验、解包、格式转换、校验报告"

[[bin]]
name = "ledger"
path = "src/bin/ledger.rs"

[[bin]]
name = "doccheck"
path = "src/bin/doccheck.rs"

[[bin]]
name = "unpak"
path = "src/bin/unpak.rs"

[[bin]]
name = "build_assets"
path = "src/bin/build_assets.rs"

[[bin]]
name = "map2json"
path = "src/bin/map2json.rs"

[[bin]]
name = "serve"
path = "src/bin/serve.rs"

[[bin]]
name = "controls"
path = "src/bin/controls.rs"

[[bin]]
name = "classify"
path = "src/bin/classify.rs"

[[bin]]
name = "specskel"
path = "src/bin/specskel.rs"

[[bin]]
name = "mod2ogg"
path = "src/bin/mod2ogg.rs"

[dependencies]
ti-formats.workspace = true
# OGG/Opus 转码（S1.7b）：mod2ogg / build_assets 走 ti-platform/ogg feature，
# opus-pure 经 ti-platform 传递引入，ti-tools 不再直接依赖 opus-pure（更干净的单一路径）。
ti-platform = { workspace = true, features = ["ogg"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
