[package]
name = "ti-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TreasureIsl 组装层：场景注册、主循环、三端入口（入口 bin 随 S2/S3 加入）"

[dependencies]
thiserror.workspace = true
# S18.8a：发货壳已切 Bevy（ti-app 的 macroquad native/wasm 壳退役，发货入口 = ti-engine 的
# `treasure-bevy-native` / `treasure-bevy-wasm`），macroquad 在本 crate 降为
# **android 壳专用 optional 依赖**（S2.6 资源 IO 走 macroquad::file::load_file 的
# APK assets 后端 + 音频走 quad-snd；android 壳本身在 S18.8d 才退役）。
# macroquad 库依赖的**完全**退役（连 ti-platform 一并）属 S18.8b/S18.8c 范围。
ti-core.workspace = true
ti-formats.workspace = true
ti-platform.workspace = true
ti-render.workspace = true
# S5.2：headless 全流程脚本解析（full_run.json，复用 workspace serde/serde_json，不新增依赖）
serde.workspace = true
serde_json.workspace = true
# UI-21 TTF 软件光栅化（纯 Rust，无 Freetype 依赖）
ab_glyph.workspace = true
# S18.4 架构修正：bevy 壳 bin 在 **ti-engine 独立 workspace**（`crates/ti-engine/src/bin/`）——
# links=alsa 冲突检查 target-independent 且 optional 依赖也进 resolution 图，双渲染期
# ti-app（macroquad audio 发货壳）与 bevy（dev_tools→rodio→alsa 链）不能同 cargo 图；
# ti-engine 以 default-features=false 挂 ti-app（关 macroquad-audio），图中只余 bevy 侧 alsa 链。
# S18.8a：ti-app 的 macroquad 发货壳退役后，ti-app 侧已无 alsa 链（macroquad 音频随
# android 壳下沉为 optional），双渲染期的 alsa 冲突前提消失 → ti-engine 并回根 workspace
# 属 S18.8c。
# S15.5：渲染快照/视觉回归基线（1080 代码绘制帧 → DEFLATE PNG，`png` 已在 workspace 依赖，
# 经 ti-platform hd-8bit 进入；此处 dev-dep 供 tests/ 基线门禁直接编码/解码，零新增外部库）
[dev-dependencies]
png.workspace = true

[[bin]]
name = "treasure-headless"
path = "src/bin/treasure_headless.rs"
required-features = ["headless"]


# S13.6（契约 §7）：元素级渲染验证 bin —— 逐精灵 blit dump 落点/越界判定/像素贡献。
# 与 render_snapshot（gate 第 19 项全帧 diff）互补：全帧 diff 锁「整体没漂」，
# element_dump 定位「漂的是哪个元素」（docs/process/07_render_pipeline.md §7）。
[[bin]]
name = "element-dump"
path = "src/bin/element_dump.rs"
required-features = ["native-shell"]

# S13.6（契约 §7）：逐精灵渲染验证 bin —— 累积 blit 记录 0..=N，输出 4x 放大 PNG 供肉眼确认。
[[bin]]
name = "sprite-step"
path = "src/bin/sprite_step.rs"
required-features = ["native-shell"]

# 渲染意图排查（08_layout_design.md §4）：7 场景完整帧导出 4x PNG（场景层+精灵+地形叠加），
# 供肉眼过「立绘盖不盖文字/血条/瓦片画没画对」等跨层观感问题。与 sprite-step（只渲染 .Map 层）互补。
[[bin]]
name = "render-png"
path = "src/bin/render_png.rs"
required-features = ["native-shell"]

[features]
# S8.9：HD 资源提升为默认档——默认构建含 `hd-8bit`（RGBA8 真彩帧缓冲 + PNG 解码）。
# 缺失 `assets_hd_pack` 时 bin 自动回退 RGB565 PCX 原路径（不 panic）。
# 需要纯 RGB565 时 `--no-default-features` 关闭。
default = ["hd-8bit", "gpu-render"]
# 桌面 native **诊断**壳（S13.6 契约 §7）：std::fs 读本地 data/ 资源（与 wasm 同源），
# 无窗口输出元素级/逐精灵/整帧证据。S18.8a：macroquad 发货壳（`treasure-native` /
# `treasure-wasm`）退役后，发货入口 = ti-engine 的 Bevy 壳（`treasure-bevy-native` /
# `treasure-bevy-wasm`）；本 feature 仅供**官方排障 bin** 使用（gate 第 4b 项编译 + lint 覆盖）。
native-shell = []
# S4.3 性能诊断：主循环每秒打印平均 FPS + 呈现器上传/跳帧计数
stats = []
# S1.7b：MOD → OGG/Opus 在线转码（默认关闭，build_assets 离线预转码产物直接播放；
# 开启后启用 ti-platform/ogg（opus-pure），仅供测试链路与在线转码场景，
# 见 docs/style.md §5.9 与 wasm 800 KB 体积预算）
mod-ogg = ["ti-platform/ogg"]
# S5.2：headless 全流程回归（P3-3 判据）：无窗口跑 GameApp 逻辑链，
# 按 full_run.json 固定种子脚本逐步喂事件，断言场景流转 0 失败
headless = []
# S7.5：RGBA8 HD 帧缓冲 + PNG 解码（默认关，RGB565 原路径不变；
# 透传 ti-platform 的 hd-8bit，`png` 随其 optional 依赖进入，EXP-046 门控）
hd-8bit = ["ti-platform/hd-8bit"]

# S10.4：GPU 化渲染（macroquad 逐精灵 batch + 纹理图集 + alpha 混合 + TTF 字形）。
# 默认开；legacy CPU 逐像素 blit 路径在 `gpu-render` 关闭时生效（feature 互斥）。
gpu-render = []
# S10.4 legacy：CPU 逐像素 blit 路径（P4-1 历史基准回退；默认关）。
# 开启 `legacy-render` 时 CPU 路径编译进构建，GPU 路径不生效。
legacy-render = []
# S10.4：原版 GoldLand.Fnt 点阵字（怀旧模式；默认关）。
# 开启 `legacy-font` 时字形走 `glyph_raster::Raster` 点阵光栅，TTF 矢量字形不生效。
legacy-font = []

[lints]
workspace = true
